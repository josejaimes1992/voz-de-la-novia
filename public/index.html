<style>

mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}

.trow.picked{border-color:var(--accent);background:var(--accent-soft)}

<script>
"use strict";
const LOGO_FULL="/logo.jpg?v=2";
let LOGO_DATA=null, VDN_DATA=null;
fetch('/vdn-logo.jpg?v=2').then(r=>r.blob()).then(b=>new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(b); })).then(d=>{ VDN_DATA=d; }).catch(()=>{});

const CHURCH="Tabernáculo Shalom Adonai";
const APP="Voz de la Novia";
/* ============ Música: notas, acordes, transposición ============ */
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT =['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const LAT={C:'Do',D:'Re',E:'Mi',F:'Fa',G:'Sol',A:'La',B:'Si'};
const LAT_IN=[['Sol',7],['Do',0],['Re',2],['Mi',4],['Fa',5],['La',9],['Si',11]];
const AM_IN={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const MAJ_NAMES=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const MIN_NAMES=['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
const FLAT_MAJ=new Set([5,10,3,8,1]); const FLAT_MIN=new Set([2,7,0,5,10,3]);
const SUFFIX_OK=/^(?:maj|min|dim|aug|sus|add|m|M|°|º|ø|\+|-|b|#|\d|\(|\)|,)*$/;

function parseNote(s){
  for(const [n,i] of LAT_IN){ if(s.startsWith(n)) return acc(i,n.length,s); }
  const c=s[0]; if(c in AM_IN) return acc(AM_IN[c],1,s);
  return null;
  function acc(i,len,s){ const a=s[len]; if(a==='#'||a==='♯') return {idx:(i+1)%12,len:len+1}; if(a==='b'||a==='♭') return {idx:(i+11)%12,len:len+1}; return {idx:i,len}; }
}
function parseChord(tok){
  const t=tok.trim(); if(!t) return null;
  const r=parseNote(t); if(!r) return null;
  let rest=t.slice(r.len), bass=null; const sl=rest.lastIndexOf('/');
  if(sl>=0){ const b=parseNote(rest.slice(sl+1)); if(b && b.len===rest.length-sl-1){ bass=b.idx; rest=rest.slice(0,sl);} }
  if(!SUFFIX_OK.test(rest)) return null;
  return {root:r.idx,suf:rest,bass};
}
function noteName(i,flat,latin){ const n=(flat?FLAT:SHARP)[((i%12)+12)%12]; return latin? LAT[n[0]]+n.slice(1) : n; }
function fmtChord(raw,shift,flat,latin){
  const c=parseChord(raw); if(!c) return raw;
  return noteName(c.root+shift,flat,latin)+c.suf+(c.bass!=null?'/'+noteName(c.bass+shift,flat,latin):'');
}
function parseKey(k){
  if(!k) return null; const r=parseNote(k.trim()); if(!r) return null;
  const rest=k.trim().slice(r.len).trim().toLowerCase();
  const minor=rest.startsWith('m') && !rest.startsWith('maj') && !rest.startsWith('may');
  return {idx:r.idx,minor};
}
function keyLabel(idx,minor,latin){
  const n=(minor?MIN_NAMES:MAJ_NAMES)[((idx%12)+12)%12];
  return (latin? LAT[n[0]]+n.slice(1) : n)+(minor?'m':'');
}
function keyCanon(idx,minor){ return keyLabel(idx,minor,false); }
function keyLong(idx,minor){ const n=(minor?MIN_NAMES:MAJ_NAMES)[((idx%12)+12)%12]; return LAT[n[0]]+n.slice(1).replace('#','♯').replace('b','♭')+(minor?' menor':' mayor'); }
function useFlatFor(k,shift){ if(!k) return false; const i=((k.idx+shift)%12+12)%12; return k.minor?FLAT_MIN.has(i):FLAT_MAJ.has(i); }
function normShift(s){ s=((s%12)+12)%12; return s>6?s-12:s; }
const ALL_KEYS=[]; for(let i=0;i<12;i++) ALL_KEYS.push(keyCanon(i,false)); for(let i=0;i<12;i++) ALL_KEYS.push(keyCanon(i,true));

/* ============ Texto de canción (formato con corchetes) ============ */
const SEC_RE=/^\s*\[?\s*(intro|introducci[oó]n|verso|estrofa|coro|pre-?coro|precoro|puente|final|outro|interludio|tag|instrumental)\b[^\]\n]*\]?\s*:?\s*$/i;
function parseLine(line){
  const t=line.replace(/\s+$/,'');
  if(/^\s*#/.test(t)) return {type:'sec',text:t.replace(/^\s*#+\s*/,'')};
  if(!t.trim()) return {type:'gap'};
  const parts=t.split(/\[([^\]]*)\]/); const segs=[];
  if(parts[0]) segs.push({c:null,t:parts[0]});
  for(let i=1;i<parts.length;i+=2) segs.push({c:parts[i],t:parts[i+1]||''});
  const lyric=segs.map(s=>s.t).join('');
  const has=segs.some(s=>s.c);
  /* Acordes escritos como texto encima de la letra (G  D  Em): cuentan como línea de acordes */
  if(!has && isChordLine(t)) return {type:'ln',segs,lyric,has:false,chordOnly:true,txt:true};
  return {type:'ln',segs,lyric,has,chordOnly:has && !lyric.trim()};
}
function parseSong(body){ return (body||'').split(/\r?\n/).map(parseLine); }
function isChordLine(line){
  const toks=line.trim().split(/\s+/).filter(x=>x && !/^(\||\/|-|x\d+|\(x?\d+x?\))$/i.test(x));
  return toks.length>0 && toks.every(t=>parseChord(t.replace(/^\(|\)$/g,'')));
}
function convertChordsOverLyrics(text){
  const L=text.split(/\r?\n/), out=[];
  for(let i=0;i<L.length;i++){
    const line=L[i];
    if(SEC_RE.test(line) && !isChordLine(line)){ out.push('# '+line.replace(/[\[\]:]/g,'').trim().replace(/^./,c=>c.toUpperCase())); continue; }
    if(line.trim() && isChordLine(line)){
      const toks=[...line.matchAll(/\S+/g)].filter(m=>parseChord(m[0]));
      const next=L[i+1];
      if(next!=null && next.trim() && !isChordLine(next) && !SEC_RE.test(next)){
        let ly=next;
        for(let k=toks.length-1;k>=0;k--){ const p=toks[k].index; if(ly.length<p) ly=ly.padEnd(p,' '); ly=ly.slice(0,p)+'['+toks[k][0]+']'+ly.slice(p); }
        out.push(ly.replace(/\s+$/,'')); i++;
      } else out.push(toks.map(m=>'['+m[0]+']').join(' '));
      continue;
    }
    out.push(line);
  }
  return out.join('\n');
}

/* ============ Almacenamiento (servidor) ============ */
const S={mode:'loading',songs:new Map(),programs:new Map(),canWrite:false,isAdmin:false,user:null,token:null,error:false,unread:0};
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch{ return d; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch{} }
function newId(p){ return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function strip(o){ const c={...o}; delete c.id; return c; }
async function api(path,opt={}){
  const headers={'Content-Type':'application/json'}; if(S.token) headers.Authorization='Bearer '+S.token;
  const r=await fetch(path,{...opt,headers}); if(r.status===401||r.status===403){ const err=new Error('auth'); err.code=r.status; throw err; }
  if(!r.ok) throw new Error('http '+r.status); return r.status===204?null:r.json();
}
let lastSig='';
async function loadData(){
  try{
    const d=await api('/api/data'); const sig=JSON.stringify(d); if(sig===lastSig) return; lastSig=sig;
    S.songs=new Map(d.songs.map(x=>[x.id,x])); S.programs=new Map(d.programs.map(x=>[x.id,x])); S.error=false; S.mode='api'; onData();
  }catch(e){ if(S.mode==='loading'){ S.mode='api'; S.error=true; render(); } }
}
async function initStore(){
  S.token=lsGet('vdn-token',null);
  if(S.token){ try{ const c=await api('/api/me'); setUser(c.user); if(!c.user){ S.token=null; lsSet('vdn-token',null);} }catch{ setUser(null); } }
  await loadData();
  setInterval(()=>{ if(document.visibilityState==='visible' && V.view!=='edit') loadData(); },15000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && V.view!=='edit') loadData(); });
}
function setUser(u){ S.user=u||null; S.canWrite=!!u; S.isAdmin=!!u&&u.role==='admin'; if(S.isAdmin&&window.teamPoll) teamPoll(); if(u&&window.loadTeam) loadTeam(); if(!u) S.team=new Map(); }
function lostAuth(){ setUser(null); S.token=null; lsSet('vdn-token',null); toast('Tu sesión terminó. Vuelve a ingresar para editar.'); render(); }
async function writeDoc(col,obj){
  if(!S.canWrite){ toast('Ingresa con tu usuario para editar.'); return false; }
  obj.updatedAt=Date.now();
  try{ await api(`/api/${col}/${encodeURIComponent(obj.id)}`,{method:'PUT',body:JSON.stringify(strip(obj))}); }
  catch(e){ if(e.code===401) lostAuth(); else toast('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.'); return false; }
  (col==='songs'?S.songs:S.programs).set(obj.id,obj); lastSig=''; loadData(); return true;
}
async function removeDoc(col,id){
  if(!S.canWrite){ toast('Ingresa con tu usuario para editar.'); return; }
  try{ await api(`/api/${col}/${encodeURIComponent(id)}`,{method:'DELETE'}); (col==='songs'?S.songs:S.programs).delete(id); lastSig=''; }
  catch(e){ if(e.code===401) lostAuth(); else if(e.code===403) toast('Solo el administrador puede borrar canciones.'); else toast('No se pudo borrar.'); }
}
function openLogin(){
  $('#modal-root').innerHTML=`<div class="scrim" data-act="close-modal"><form class="modal" id="login-form" role="dialog" aria-label="Ingresar" data-stop style="width:min(400px,100%)">
    <header><h3>Ingresar</h3><button type="button" class="btn ghost" data-act="close-modal" aria-label="Cerrar">${ICON.x}</button></header>
    <div class="body" style="display:grid;gap:12px">
      <label class="f">Usuario<input id="login-user" autocomplete="username" autocapitalize="none" required placeholder="Ej. jose"></label>
      <label class="f">Contraseña<input id="login-pw" type="password" autocomplete="current-password" required></label>
      <p id="login-err" class="confirm" hidden></p><button class="btn pri" type="submit" style="justify-content:center">Ingresar</button></div></form></div>`;
  setTimeout(()=>$('#login-user').focus(),30);

/* ---------- Búsqueda por nombre y por letra ---------- */
function searchTokens(q){ return norm(q).replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(t=>t.length>0); }
function plainNorm(t){ return norm(t).replace(/[^\p{L}\p{N}]+/gu,' '); }
function lyricLines(s){ const out=[]; let sec=''; for(const v of [s.body,s.bodyPro]){ if(!v) continue; for(const raw of v.split('\n')){ if(/^\s*#/.test(raw)){ sec=raw.replace(/^\s*#+\s*/,''); continue; } const t=raw.replace(/\[[^\]]*\]/g,'').replace(/\s+/g,' ').trim(); if(t) out.push({t,sec}); } } return out; }
/* Índice de búsqueda por canción (se calcula una vez, no en cada letra que escribes) */
const _sIdx=new WeakMap();
function songIdx(s){ let x=_sIdx.get(s); if(x&&x.k===(s.title||'')+'|'+(s.body||'').length+'|'+(s.bodyPro||'').length) return x;
  x={k:(s.title||'')+'|'+(s.body||'').length+'|'+(s.bodyPro||'').length, title:' '+plainNorm(s.title+' '+(s.author||'')+' '+(s.category||''))+' ', tnorm:plainNorm(s.title).trim(), lines:null, lyr:null}; _sIdx.set(s,x); return x; }
function songIdxLyr(x,s){ if(!x.lines){ x.lines=lyricLines(s).map(l=>({...l,n:' '+plainNorm(l.t)+' '})); x.lyr=' '+x.lines.map(l=>l.n.trim()).join(' ')+' '; } return x; }
function matchSong(s,toks,mode){
  const X=songIdx(s); const title=X.title;
  const inTitle=mode!=='lyrics'&&toks.every(t=>title.includes(t));
  if(mode==='title'&&!inTitle) return null;
  songIdxLyr(X,s); const lines=X.lines, lyr=X.lyr;
  const inLyrics=mode!=='title'&&toks.every(t=>lyr.includes(t));
  if(!inTitle&&!inLyrics) return null;
  let score=inTitle?100:0; if(inTitle&&X.tnorm.startsWith(toks.join(' '))) score+=50;
  let line=null, sec='';
  if(inLyrics){ const phrase=toks.join(' ');
    let best=null; for(const l of lines){ const n=l.n; const c=toks.filter(t=>n.includes(t)).length+(n.includes(phrase)?toks.length:0)+(toks.some(t=>n.includes(' '+t+' '))?0.5:0); if(c>0&&(!best||c>best.c)) best={c,l}; }
    if(best){ line=snipAround(best.l.t,toks); sec=best.l.sec; score+=10+best.c*5; if(lyr.includes(' '+phrase+' ')) score+=20; }
  }

function snipAround(text,toks){ if(text.length<=55) return text; const nc=[...text].map(c=>{ const n=norm(c); return n.length===1?n:(n[0]||' '); }).join(''); let i=-1; for(const t of toks){ const j=nc.indexOf(t); if(j>=0&&(i<0||j<i)) i=j; } if(i<=25) return text; const st=text.lastIndexOf(' ',i-15); return '…'+text.slice(st>0?st+1:i-15); }

const SHINGLES=new WeakMap();
function lyricShingles(s){
  if(s&&typeof s==='object'&&SHINGLES.has(s)) return SHINGLES.get(s);
  const words=plainNorm(lyricLines(s).map(l=>l.t).join(' ')).split(' ').filter(w=>w.length>1);
  const set=new Set(); for(let i=0;i+2<words.length;i++) set.add(words[i]+' '+words[i+1]+' '+words[i+2]);
  if(!set.size&&words.length) set.add(words.join(' '));
  if(s&&typeof s==='object') SHINGLES.set(s,set); return set;
}
function lyricSimilarity(a,b){ if(!a.size||!b.size) return 0; const [x,y]=a.size<b.size?[a,b]:[b,a]; let n=0; for(const t of x) if(y.has(t)) n++; return n/x.size; }
/* Devuelve la canción existente más parecida: igual título, o letra igual en 60% o más */
function findDuplicate(song,pool,excludeId){
  const nt=plainNorm(song.title||'').trim(); const mine=lyricShingles(song); let best=null;
  for(const x of pool){ if(!x||x===song||(excludeId&&x.id===excludeId)) continue;
    const sameTitle=nt&&plainNorm(x.title||'').trim()===nt; const sim=mine.size>=3?lyricSimilarity(mine,lyricShingles(x)):0;
    if((sim>=0.6||(sameTitle&&(sim>=0.3||mine.size<3)))&&(!best||sim>best.sim||(sameTitle&&!best.sameTitle))) best={song:x,sim,sameTitle};
  }
  return best;
}

function markText(text,toks){
  const chars=[...text]; const nc=chars.map(c=>{ const n=norm(c); return n.length===1?n:(n[0]||' '); }).join('');
  const marks=new Array(chars.length).fill(false);
  for(const t of toks){ let i=0; while((i=nc.indexOf(t,i))>=0){ for(let k=i;k<i+t.length;k++) marks[k]=true; i+=t.length; } }
  let out='', on=false; chars.forEach((c,i)=>{ if(marks[i]&&!on){ out+='<mark>'; on=true; } if(!marks[i]&&on){ out+='</mark>'; on=false; } out+=esc(c); }); if(on) out+='</mark>';

let wakeLock=null;
async function keepAwake(on){ try{ if(on && navigator.wakeLock && !wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); } else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; } }catch{ wakeLock=null; } }
function liveEntries(){
  if(V.live.programId){ const p=S.programs.get(V.live.programId); return (p?.items||[]).map(it=>({song:S.songs.get(it.songId),key:it.key,note:it.note})).filter(e=>e.song); }
  const s=S.songs.get(V.live.songId); return s?[{song:s,key:null,note:''}]:[];
}
function renderLive(){
  const root=$('#live-root'); if(!V.live){ root.innerHTML=''; keepAwake(false); return; }
  const E=liveEntries(); if(!E.length){ V.live=null; root.innerHTML=''; return; }
  V.live.idx=Math.min(V.live.idx,E.length-1); const e=E[V.live.idx]; const k=songKey(e.song);
  const base=e.key&&k?normShift(parseKey(e.key).idx-k.idx):0; const shift=base+(V.live.extra||0);
  const prev=E[V.live.idx-1], next=E[V.live.idx+1];
  const liveCapo=V.live.capo!=null?V.live.capo:(Number(e.song.capo)||0); V.live.capoNow=liveCapo;
  const oldBody=$('#live-body'); const keepScroll=oldBody&&V.live.renderedIdx===V.live.idx?oldBody.scrollTop:0; V.live.renderedIdx=V.live.idx;
  root.innerHTML=`<div class="live" role="dialog" aria-label="Modo en vivo">
    <div class="live-top"><button class="btn ghost" data-act="live-close" aria-label="Salir del modo en vivo">${ICON.x}</button>
      <span class="key sm">${esc(keyText(k,shift))}</span><span class="ttl">${esc(e.song.title)}</span>${E.length>1?`<span class="cnt">${V.live.idx+1} / ${E.length}</span>`:''}

const PDF_OPTS={inst:lsGet('vdn-pdf-inst','guitar')};

function drawPdfPiano(doc,a,label,x,y,INK,CHORD){
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...CHORD); doc.text(label,x+38,y+8,{align:'center'});
  const iv=PDF_IV[Acordes.normSuffix(a.s)]||PDF_IV.major; const on=new Set(iv.map(i=>{ let p=a.r+i; while(p>=24) p-=12; return p; }));

  for(let p=0;p<24;p++){ if(!isBlack(p)) continue; const bx=wx[p-1]+ww-bw/2; doc.setFillColor(...(on.has(p)?CHORD:INK)); doc.rect(bx,gy,bw,bh,'F'); }

function openPdfOpts(run){

function drawPdfChord(doc,inst,a,label,x,y,INK,CHORD){
  const ps=Acordes.positions(inst,a.r,a.s,a.b===''?null:a.b); const strings=inst==='ukulele'?4:6;
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...CHORD); doc.text(label,x+26,y+8,{align:'center'});
  if(!ps.length) return;
  const [fr,fi,base,barres]=ps[0]; const frets=[...fr].map(c=>c==='x'?-1:(c>='a'?c.charCodeAt(0)-87:Number(c)));
  const gx=x+8, gy=y+20, gw=36, sp=gw/(strings-1), fh=10, rows=4;
  doc.setDrawColor(...INK); doc.setLineWidth(0.5);
  for(let r=0;r<=rows;r++) doc.line(gx,gy+r*fh,gx+gw,gy+r*fh);
  for(let i=0;i<strings;i++) doc.line(gx+i*sp,gy,gx+i*sp,gy+rows*fh);
  if(base===1){ doc.setLineWidth(2); doc.line(gx,gy,gx+gw,gy); doc.setLineWidth(0.5); }
  else { doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...INK); doc.text(String(base),gx-3,gy+fh*0.7,{align:'right'}); }
  doc.setFillColor(...INK);
  (barres||[]).forEach(bf=>{ const idx=frets.map((f,i)=>f===bf?i:-1).filter(i=>i>=0); if(idx.length<2) return; const s0=Math.min(...idx), s1=Math.max(...idx); doc.roundedRect(gx+s0*sp-2.6,gy+(bf-0.5)*fh-2.6,(s1-s0)*sp+5.2,5.2,2.6,2.6,'F'); });
  frets.forEach((f,i)=>{ const cx=gx+i*sp;
    if(f<0){ doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...INK); doc.text('x',cx,gy-2.5,{align:'center'}); }
    else if(f===0){ doc.circle(cx,gy-4,1.6,'S'); }
    else doc.circle(cx,gy+(f-0.5)*fh,2.6,'F');
  });
}
function buildPdf(entries,mode,head){
  if(!window.jspdf){ throw new Error('nolib'); }
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'pt',format:'a4'});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=48, CW=W-2*M;
  const INK=[26,25,20], MUTED=[98,95,85], CHORD=[176,49,42], ACC=[138,101,16];
  let y=M;
  const ensure=h=>{ if(y+h>H-M-14){ doc.addPage(); y=M; } };
  if(head){
    if(VDN_DATA){ try{ doc.addImage(VDN_DATA,'JPEG',M+17,y,70,70); }catch{} }
    doc.setFont('times','bold'); doc.setFontSize(13); doc.setTextColor(...ACC); doc.text(pdfText(APP),M+120,y+28);
    doc.setFont('times','italic'); doc.setFontSize(10.5); doc.setTextColor(...MUTED); doc.text(pdfText('Unidos en una misma alabanza'),M+120,y+44);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text(pdfText(CHURCH.toUpperCase()),M+120,y+58);
    y+=96;
    doc.setFont('times','bold'); doc.setFontSize(22); doc.setTextColor(...INK); doc.text(pdfText(head.title),M,y+14); y+=30;
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(...MUTED); doc.text(pdfText(head.sub),M,y); y+=20;
    doc.setDrawColor(...ACC); doc.setLineWidth(1.2); doc.line(M,y,W-M,y); y+=18;
    doc.setFontSize(11);
    entries.forEach((e,i)=>{ ensure(16); doc.setTextColor(...INK); doc.setFont('helvetica','bold'); doc.text(`${i+1}.`,M,y); doc.setFont('helvetica','normal'); doc.text(pdfText(e.song.title),M+20,y); doc.setFont('courier','bold'); doc.setTextColor(...ACC); doc.text(pdfText(e.keyText),W-M,y,{align:'right'}); if(e.note){ y+=13; doc.setFont('helvetica','italic'); doc.setFontSize(9.5); doc.setTextColor(...MUTED); doc.text(pdfText(e.note),M+20,y); doc.setFontSize(11);} y+=17; });
    if(head.notes){ y+=4; doc.setFont('helvetica','italic'); doc.setFontSize(10); doc.setTextColor(...MUTED); doc.splitTextToSize(pdfText(head.notes),CW).forEach(l=>{ ensure(13); doc.text(l,M,y); y+=13; }); }
    doc.addPage(); y=M;
  }
  entries.forEach((e,ei)=>{
    if(ei>0){ if(mode==='acordes'){ doc.addPage(); y=M; } else { y+=14; ensure(110); } }
    const k=songKey(e.song); const flat=useFlatFor(k,e.shift);
    doc.setFont('times','bold'); doc.setFontSize(17); doc.setTextColor(...INK);
    const tl=doc.splitTextToSize(pdfText((head?`${ei+1}. `:'')+e.song.title),CW-60); tl.forEach((l,i)=>{ doc.text(l,M,y+12+i*19); });
    doc.setFont('courier','bold'); doc.setFontSize(12); doc.setTextColor(...ACC); doc.text(pdfText(e.keyText),W-M,y+12,{align:'right'});
    y+=12+tl.length*19-4;
    const meta=[e.song.author,e.note].filter(Boolean).join(' · ');
    if(meta){ doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...MUTED); doc.text(pdfText(meta),M,y+2); y+=14; }
    y+=10;
    const chordsBy=V.ver==='original'&&e.song.bodyPro&&e.song.bodyPro.trim()?(e.song.chordsProBy||e.song.updatedBy):(e.song.chordsBy||e.song.createdBy);
    if(mode==='acordes' && PDF_OPTS.inst!=='none' && window.Acordes && Acordes.ready()){
      const inst=PDF_OPTS.inst; const capo=inst==='piano'?0:(Number(e.song.capo)||0); const sh=e.shift-capo; const fl=useFlatFor(k,sh); const seen=new Map();
      for(const L of parseSong(sb(e.song))) if(L.type==='ln') for(const sg of L.segs) if(sg.c){ const a=chordAttrs(sg.c,sh); if(!a) continue; const id=a.r+'|'+a.s+'|'+a.b; if(!seen.has(id)) seen.set(id,{a,label:pdfText(fmtChord(sg.c,sh,fl,false))}); }
      if(capo){ doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...CHORD); doc.text(pdfText('Capo '+capo+' (los acordes son formas)'),M,y); y+=12; }
      const cw=inst==='piano'?76:52, chH=inst==='piano'?50:74; let x=M; if(seen.size) ensure(chH+6);
      for(const {a,label} of seen.values()){

    if(mode==='acordes' && chordsBy){ doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...MUTED); doc.text(pdfText('Acordes por: '+chordsBy),M,y+2); y+=16; }
    const lines=parseSong(sb(e.song));
    if(mode==='letra'){
      const LH=15.5; let lastGap=true;
      for(const L of lines){
        if(L.type==='sec'){ ensure(LH*3); y+=lastGap?2:8; doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...ACC); doc.text(pdfText(L.text.toUpperCase()),M,y); y+=13; lastGap=true; continue; }
        if(L.type==='gap'){ if(!lastGap) y+=7; lastGap=true; continue; }

        doc.setFont('helvetica','normal'); doc.setFontSize(11.5); doc.setTextColor(...INK);
        doc.splitTextToSize(pdfText(L.lyric.trim()),CW).forEach(l=>{ ensure(LH); doc.text(l,M,y); y+=LH; }); lastGap=false;
      }

      doc.setFont('courier','normal'); doc.setFontSize(10.5); const cw=doc.getTextWidth('M'); const maxC=Math.floor(CW/cw); const LH=12.6; let lastGap=true;
      for(const L of lines){
        if(L.type==='sec'){ ensure(LH*3); y+=lastGap?2:8; doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...ACC); doc.text(pdfText(L.text.toUpperCase()),M,y); y+=13; lastGap=true; continue; }
        if(L.type==='gap'){ if(!lastGap) y+=7; lastGap=true; continue; }
        let ch='', ly='';
        for(const s of L.segs){
          if(s.c){ const c=fmtChord(s.c,e.shift,flat,false); let start=Math.max(ly.length, ch.length? ch.length+1:0);
            if(start>ly.length){ const mid=ly.length && /\S$/.test(ly) && /^\S/.test(s.t); ly=ly+(mid?'-':' ').repeat(start-ly.length); }

          const c1=ch.slice(0,cut).replace(/\s+$/,''), l1=ly.slice(0,cut).replace(/\s+$/,'');

          if(c1){ doc.setFont('courier','bold'); doc.setTextColor(...CHORD); doc.text(c1,M,y); y+=LH; }
          if(l1){ doc.setFont('courier','normal'); doc.setTextColor(...INK); doc.text(l1,M,y); y+=LH+1.5; }
          ch=ch.slice(cut).replace(/^\s+/,''); ly=ly.slice(cut).replace(/^\s+/,'');

        }

      }
    }

  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...MUTED); doc.text(pdfText(foot),M,H-24); doc.text(`Página ${i} de ${n}`,W-M,H-24,{align:'right'}); }
  return doc.output('blob');
}
async function savePdf(entries,mode,head,filename){
  let blob; try{ blob=buildPdf(entries,mode,head); }catch(e){ toast('No se pudo generar el PDF. Revisa tu conexión y recarga la página.'); return; }

    case 'inst': V.inst=ds.v; lsSet('vdn-inst',V.inst); if($('#cd-modal')) drawChordModal(true); if(V.live) renderLive(); render(); break;
    case 'strip': V.strip=!V.strip; lsSet('vdn-strip',V.strip); if(V.live) renderLive(); else render(); break;
    case 'metro': if(V.metro){ stopMetro(); } else if(window.Acordes&&Acordes.metroStart(Number(ds.bpm),b=>{ document.querySelectorAll('#beats .beat').forEach((el,i)=>{ el.className='beat'+(i===b?(b===0?' acc':' on'):''); }); })){ V.metro=true; } if(V.live) renderLive(); else render(); break;
    case 'scroll': V.live.speed=Math.max(0,Math.min(12,(V.live.speed||0)+Number(ds.d))); renderLive(); startAutoScroll(); break;
    case 'chords': V.chords=ds.v==='1'; lsSet('vdn-chords',V.chords); if(V.live) renderLive(); else render(); break;
    case 'shift': if(V.live){ V.live.extra=(V.live.extra||0)+Number(ds.d); renderLive(); } else { V.shift=normShift(V.shift+Number(ds.d)); render(); } break;
    case 'size': V.size=Math.min(2,Math.max(.7,Math.round((V.size+Number(ds.d)*.1)*10)/10)); lsSet('cancionero-size',V.size); document.documentElement.style.setProperty('--lyric',V.size); break;
    case 'new-song': V.placer=false; V.etab='basica'; V.draft={id:newId('c'),title:'',author:'',key:'',category:'',body:'',notes:''}; go('edit'); break;
    case 'edit-song': V.placer=false; V.etab=(V.ver==='original'?'original':'basica'); V.draft={...S.songs.get(V.songId)}; go('edit'); break;
    case 'cancel-edit': V.draft=null; S.songs.has(V.songId)?go('song'):go('list'); break;
    case 'convert': { const ta=edTA(); ta.value=convertChordsOverLyrics(ta.value); ta.dispatchEvent(new Event('input')); toast('Acordes convertidos. Revisa la vista previa.'); break; }
    case 'save-song': { const d=readDraft(); if(!d.title){ toast('Ponle un título a la canción.'); $('#e-title').focus(); break; } if(!S.songs.has(d.id)&&V.confirm!=='dup-save'){ const dup=findDuplicate(d,[...S.songs.values()],d.id); if(dup){ V.confirm='dup-save'; V.dupInfo=dup; render(); toast('Esta canción parece que ya existe. Revisa el aviso.'); break; } } if(V.confirm==='dup-save') V.confirm=null; delete d.ejemplo; delete d.updatedBy; delete d.updatedAt; { const o=S.songs.get(d.id); if(o&&window.cifChordSig){ if(cifChordSig(o.body)!==cifChordSig(d.body)) delete d.chordsAuto; if(cifChordSig(o.bodyPro)!==cifChordSig(d.bodyPro)) delete d.chordsProAuto; const lyr=t=>String(t||'').replace(/\[[^\]]*\]/g,'').replace(/\s+/g,' ').trim(); if(lyr(o.body)!==lyr(d.body)) delete d.lyricsAuto; } } if(await writeDoc('songs',d)){ V.draft=null; V.songId=d.id; V.shift=0; go('song'); toast('Canción guardada.'); } break; }
    case 'del-song': readDraft(); V.confirm='del-song'; render(); break;
    case 'del-song-yes': await removeDoc('songs',V.draft.id); V.draft=null; go('list'); toast('Canción enviada a la papelera. Puedes rescatarla durante 60 días.'); break;
    case 'confirm-no': if(V.view==='edit') readDraft(); V.confirm=null; render(); break;
    case 'pdf-song': { const s=S.songs.get(V.songId); const run=()=>savePdf([songEntry(s,V.shift)],ds.mode,null,`${slug(s.title)}-${ds.mode}.pdf`); if(ds.mode==='acordes') openPdfOpts(run); else run(); break; }
    case 'pdf-inst': { PDF_OPTS.inst=ds.v; lsSet('vdn-pdf-inst',ds.v); closeModal(); if(PDF_OPTS.run) PDF_OPTS.run(); break; }
    case 'live-song': V.live={songId:V.songId,idx:0,extra:V.shift,capo:V.capo,speed:0}; renderLive(); break;
    case 'add-to-prog': openProgPicker(); break;
    case 'add-to': { const s=S.songs.get(V.songId); let p; if(ds.id==='__new'){ p={id:newId('p'),title:'Nuevo programa',date:new Date().toISOString().slice(0,10),service:'',notes:'',items:[]}; } else p=JSON.parse(JSON.stringify(S.programs.get(ds.id)));
      const k=songKey(s); p.items=[...(p.items||[]),{songId:s.id,key:k?keyCanon(k.idx+V.shift,k.minor):'',note:''}]; closeModal(); if(await writeDoc('programs',p)) toast(`Agregada a “${p.title}”.`); break; }
    case 'new-prog': { const p={id:newId('p'),title:'Culto dominical',date:new Date().toISOString().slice(0,10),service:'',notes:'',items:[]}; if(await writeDoc('programs',p)){ V.programId=p.id; go('program'); } break; }
    case 'open-prog': V.programId=ds.id; go('program'); break;
    case 'pick-song': openPicker(); break;
    case 'pick': { const p=JSON.parse(JSON.stringify(S.programs.get(V.programId))); const s=S.songs.get(ds.id); const k=songKey(s); p.items=[...(p.items||[]),{songId:s.id,key:k?keyCanon(k.idx,k.minor):'',note:''}]; closeModal(); await writeDoc('programs',p); render(); toast(`“${s.title}” agregada.`); break; }
    case 'mv': { const p=JSON.parse(JSON.stringify(S.programs.get(V.programId))); const i=+ds.i, j=i+Number(ds.d); if(j<0||j>=p.items.length) break; [p.items[i],p.items[j]]=[p.items[j],p.items[i]]; await writeDoc('programs',p); render(); break; }
    case 'rm-item': { const p=JSON.parse(JSON.stringify(S.programs.get(V.programId))); p.items.splice(+ds.i,1); await writeDoc('programs',p); render(); break; }
    case 'del-prog': V.confirm='del-prog'; render(); break;
    case 'del-prog-yes': await removeDoc('programs',V.programId); V.tab='programs'; go('programs'); toast('Programa borrado.'); break;
    case 'dup-prog': { const o=S.programs.get(V.programId); const p={...JSON.parse(JSON.stringify(o)),id:newId('p'),title:o.title+' (copia)',date:new Date().toISOString().slice(0,10)}; delete p.ejemplo; if(await writeDoc('programs',p)){ V.programId=p.id; go('program'); toast('Programa duplicado.'); } break; }
    case 'live-prog': V.live={programId:V.programId,idx:0,extra:0}; renderLive(); break;
    case 'live-go': liveGo(Number(ds.d)); break;
    case 'live-close': V.live=null; stopMetro(); renderLive(); break;
    case 'pdf-prog': { const p=S.programs.get(V.programId); const E=(p.items||[]).map(it=>{ const s=S.songs.get(it.songId); return s?songEntry(s,itemShift(it),it.note):null; }).filter(Boolean); const f=fmtDate(p.date);
      const run=()=>savePdf(E,ds.mode,{title:p.title||'Programa',sub:[f.full.replace(/^./,c=>c.toUpperCase()),p.service].filter(Boolean).join(' · '),notes:p.notes},`${slug(p.title)}-${p.date||''}-${ds.mode}.pdf`); if(ds.mode==='acordes') openPdfOpts(run); else run(); break; }
    case 'close-modal': closeModal(); break;
  }
});
let _qT=null;
document.addEventListener('input',ev=>{ const el=ev.target; if(el.dataset.in==='q'){ V.q=el.value; clearTimeout(_qT);
  _qT=setTimeout(updateSongResults,V.q.length<=1?140:70); } });
document.addEventListener('change',async ev=>{
  const el=ev.target;
  if(el.dataset.capo){ const n=Number(el.value)||0; if(V.live){ V.live.capo=n; renderLive(); } else { V.capo=n; render(); } return; }
  if(el.dataset.pf){ const p={...S.programs.get(V.programId)}; p[el.dataset.pf]=el.value; delete p.ejemplo; await writeDoc('programs',p); }
  if(el.dataset.it){ const p=JSON.parse(JSON.stringify(S.programs.get(V.programId))); p.items[+el.dataset.i][el.dataset.it]=el.value; await writeDoc('programs',p); if(el.dataset.it==='key') render(); }
});
render(); initStore(); if(window.Acordes) Acordes.load().then(()=>{ if(V.view==='song') render(); if(V.live) renderLive(); });
</script>
