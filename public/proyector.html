<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Proyector · Voz de la Novia</title>
<link rel="icon" href="/vdn-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:none;user-select:none;-webkit-user-select:none}
body.cur{cursor:default}
.stage{position:fixed;inset:0;display:grid;place-items:center}
.layer{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .35s ease}
.layer.on{opacity:1}
.txt{width:92vw;height:86vh;display:flex;align-items:center;justify-content:center;text-align:center}
.txt p{margin:0;font-weight:700;line-height:1.22;white-space:pre-line;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.6);letter-spacing:.005em}
.logos{display:flex;align-items:center;justify-content:center;gap:6vw;height:100%}
.logos img{height:min(52vh,40vw);width:auto;display:block}
.hint{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);background:rgba(255,255,255,.1);color:#ddd;font-size:15px;padding:10px 18px;border-radius:999px;transition:opacity .5s;pointer-events:none;font-weight:600}
.hint.off{opacity:0}
.dot{position:fixed;right:14px;bottom:12px;font-size:12px;color:#888;display:flex;gap:6px;align-items:center;opacity:0;transition:opacity .4s;font-weight:600}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:#c9a640}
.dot.show{opacity:1}
</style></head><body>
<div class="stage" id="stage">
  <div class="layer" id="L-logo"><div class="logos"><img src="/vdn-logo.jpg?v=2" alt="Voz de la Novia"><img src="/shalom-logo.jpg?v=1" alt="Tabernáculo Shalom Adonai"></div></div>
  <div class="layer" id="L-a"><div class="txt"><p></p></div></div>
  <div class="layer" id="L-b"><div class="txt"><p></p></div></div>
</div>
<div class="hint" id="hint">Toca la pantalla para verla completa</div>
<div class="dot" id="dot">Reconectando…</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let cur=null, front='a', ws=null, retry=0, lastKey='';

function fitMode(p,W,H,wrap){
  p.style.whiteSpace=wrap?'pre-line':'pre';
  let lo=14, hi=Math.min(H*0.2, W*0.11);
  const ok=()=>p.scrollWidth<=W+1 && p.offsetHeight<=H;
  p.style.fontSize=hi+'px'; if(ok()) return hi;
  for(let i=0;i<14;i++){ const mid=(lo+hi)/2; p.style.fontSize=mid+'px'; if(ok()) lo=mid; else hi=mid; }
  return lo;
}
function fit(p){
  const box=p.parentElement; const W=box.clientWidth, H=box.clientHeight; if(!W||!H) return;
  // Primero sin partir líneas; si queda muy chico, se permite partirlas
  let s=fitMode(p,W,H,false);
  if(s<H*0.075){ s=fitMode(p,W,H,true); } else p.style.whiteSpace='pre';
  p.style.fontSize=s+'px';
}
function show(st){
  cur=st; const key=st.mode+'|'+(st.mode==='text'?st.text:'');
  if(key===lastKey) return; lastKey=key;
  $('#L-logo').classList.toggle('on', st.mode==='logo');
  const A=$('#L-a'), B=$('#L-b');
  if(st.mode!=='text'){ A.classList.remove('on'); B.classList.remove('on'); return; }
  const next=front==='a'?B:A, prev=front==='a'?A:B;
  const p=next.querySelector('p'); p.textContent=st.text; fit(p);
  next.classList.add('on'); prev.classList.remove('on'); front=front==='a'?'b':'a';
}
addEventListener('resize',()=>{ document.querySelectorAll('.txt p').forEach(fit); });

function connect(){
  const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/proyector';
  try{ ws=new WebSocket(url); }catch{ return later(); }
  ws.onopen=()=>{ retry=0; $('#dot').classList.remove('show'); };
  ws.onmessage=ev=>{ if(ev.data==='pong') return; try{ show(JSON.parse(ev.data)); }catch{} };
  ws.onclose=()=>{ $('#dot').classList.add('show'); later(); };
  ws.onerror=()=>{ try{ ws.close(); }catch{} };
}
function later(){ retry=Math.min(retry+1,6); setTimeout(connect, 500*2**retry); }
setInterval(()=>{ if(ws&&ws.readyState===1) ws.send('ping'); },25000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ wake(); if(!ws||ws.readyState>1) connect(); } });

let lock=null; async function wake(){ try{ if(navigator.wakeLock) lock=await navigator.wakeLock.request('screen'); }catch{} }
function full(){ const d=document.documentElement; if(!document.fullscreenElement){ (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d); } }
document.addEventListener('click',()=>{ full(); wake(); $('#hint').classList.add('off'); });
document.addEventListener('keydown',e=>{ if(e.key==='f'||e.key==='F') full(); });
let mt; document.addEventListener('mousemove',()=>{ document.body.classList.add('cur'); clearTimeout(mt); mt=setTimeout(()=>document.body.classList.remove('cur'),2000); });
setTimeout(()=>$('#hint').classList.add('off'),6000);

document.fonts&&document.fonts.ready.then(()=>document.querySelectorAll('.txt p').forEach(fit));
show({mode:'logo',text:''});
fetch('/api/proyector').then(r=>r.json()).then(show).catch(()=>{});
connect(); wake();
</script>
</body></html>
