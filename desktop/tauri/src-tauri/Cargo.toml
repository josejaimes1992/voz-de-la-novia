[package]
name = "voz-de-la-novia"
version = ""
description = "Voz de la Novia — alabanzas, Biblia y Mensaje en pantalla"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
opt-level = "s"
codegen-units = 4
