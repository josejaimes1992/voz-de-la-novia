# Programa de Windows: compila VozDeLaNovia.exe en una PC con Windows de GitHub,
# lo prueba (arranca, configura, lee un PDF) y lo publica en "Releases".
name: Programa de escritorio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/escritorio.yml"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.13" }
      - name: Lector de PDF (Poppler)
        run: |
          curl -sSL -o pop.zip https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip
          unzip -q pop.zip -d pop
          B=pop/poppler-24.08.0/Library/bin; mkdir -p winbin
          for f in pdftotext.exe pdftoppm.exe pdfinfo.exe poppler.dll lcms2.dll freetype.dll zlib.dll jpeg8.dll libcurl.dll openjp2.dll libpng16.dll tiff.dll libssh2.dll deflate.dll Lerc.dll liblzma.dll zstd.dll libcrypto-3-x64.dll; do cp "$B/$f" winbin/; done
          cp pop/poppler-24.08.0/share/poppler/COPYING winbin/POPPLER-LICENSE-GPL.txt
          printf 'Poppler 24.08.0 (https://poppler.freedesktop.org) - GPL.\r\nCodigo fuente: https://poppler.freedesktop.org/poppler-24.08.0.tar.xz\r\n' > winbin/POPPLER-LEEME.txt
      - name: Compilar
        run: |
          set -o pipefail
          bun desktop/build.ts --bin winbin --icon desktop/icon.ico 2>&1 | tee build.log || { while IFS= read -r l; do echo "::error::$l"; done < build.log; exit 1; }
      - name: Probar el programa
        run: |
          trap 'c=$?; [ $c -ne 0 ] && { echo "::error::falló la prueba (código $c)"; [ -f run.log ] && while IFS= read -r l; do echo "::error::$l"; done < run.log; }' EXIT
          set -e
          export VDN_DATA="$(cygpath -m "$RUNNER_TEMP")/vdn" VDN_NO_OPEN=1
          ./dist/VozDeLaNovia.exe > run.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4747/api/desktop/status && break; sleep 1; done; echo
          curl -sf localhost:4747/ | grep -q "Configurar Voz de la Novia"
          T=$(curl -sf localhost:4747/api/desktop/setup -H 'content-type: application/json' -d '{"mode":"local","church":"Iglesia de prueba","username":"prueba","password":"clave123"}' | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).token)')
          curl -sf -X PUT localhost:4747/api/songs/s1 -H "authorization: Bearer $T" -d '{"title":"Prueba","body":"[G]Hola"}'
          curl -sf localhost:4747/api/data | grep -q '"Prueba"'
          curl -sf localhost:4747/biblia/rv1909.json -o /dev/null
          curl -sf localhost:4747/obs -o /dev/null
          ls "$VDN_DATA"/app-*/bin/pdftotext.exe && "$VDN_DATA"/app-*/bin/pdftotext.exe -v
          cat run.log
          taskkill //F //IM VozDeLaNovia.exe || true
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/tauri/src-tauri }
      - name: Programa con ventana propia (Tauri)
        run: |
          set -o pipefail
          V=$(tr -d '\r\n ' < desktop/VERSION)
          bun -e "const f='desktop/tauri/src-tauri/tauri.conf.json';const j=JSON.parse(await Bun.file(f).text());j.version='$V';await Bun.write(f,JSON.stringify(j,null,2));const c='desktop/tauri/src-tauri/Cargo.toml';await Bun.write(c,(await Bun.file(c).text()).replace(/^version = \".*\"/m,'version = \"$V\"'))"
          cp dist/VozDeLaNovia.exe desktop/tauri/src-tauri/binaries/vdn-server-x86_64-pc-windows-msvc.exe
          cd desktop/tauri
          npx --yes @tauri-apps/cli@2 build 2>&1 | tee ../../tauri.log || { tail -n 80 ../../tauri.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          cd ../..
          cp desktop/tauri/src-tauri/target/release/bundle/nsis/*-setup.exe dist/VozDeLaNovia-Setup.exe
          ls -la dist
      - name: Probar el instalador
        run: |
          trap 'c=$?; [ $c -ne 0 ] && { echo "::error::falló la prueba del instalador (código $c)"; L="$(cygpath -u "$LOCALAPPDATA")/VozDeLaNovia/servidor.log"; [ -f "$L" ] && while IFS= read -r l; do echo "::error::$l"; done < "$L"; ls -R "$(cygpath -u "$LOCALAPPDATA")/Voz de la Novia" | head -30 | while IFS= read -r l; do echo "::error::$l"; done; }' EXIT
          set -e
          ./dist/VozDeLaNovia-Setup.exe //S
          sleep 5
          APP="$(cygpath -u "$LOCALAPPDATA")/Voz de la Novia"
          ls "$APP"
          "$APP/VozDeLaNovia.exe" &
          for i in $(seq 1 60); do curl -sf localhost:4747/api/desktop/status && break; sleep 1; done; echo
          curl -sf localhost:4747/api/desktop/status | grep -q '"native":true'
          tasklist | grep -i -E "vozdelanovia|vdn-server"
          taskkill //F //IM VozDeLaNovia.exe || true
          taskkill //F //IM vdn-server.exe || true
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/*.exe" }

  # Mac: app con ventana propia (.dmg). Apple Silicon (M1–M4) con lector de PDF incluido; Intel compilado desde el mismo Mac.
  mac:
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.13" }
      - name: Lector de PDF (Poppler) para Apple Silicon
        continue-on-error: true
        timeout-minutes: 12
        env: { HOMEBREW_NO_AUTO_UPDATE: "1", HOMEBREW_NO_INSTALL_UPGRADE: "1", HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1", HOMEBREW_NO_ANALYTICS: "1", NONINTERACTIVE: "1" }
        run: |
          brew install --quiet poppler dylibbundler
          mkdir -p macbin
          for f in pdftotext pdftoppm pdfinfo; do cp "$(brew --prefix poppler)/bin/$f" macbin/; chmod u+w macbin/$f; done
          dylibbundler -of -b -cd -x macbin/pdftotext -x macbin/pdftoppm -x macbin/pdfinfo -d macbin -p @executable_path/
          for f in macbin/*; do codesign --force -s - "$f" || true; done
          ls -la macbin
          ./macbin/pdftotext -v
      - name: Servidor (Apple Silicon e Intel)
        run: |
          set -e
          BIN=""; [ -x macbin/pdftotext ] && BIN="--bin macbin"
          bun desktop/build.ts $BIN --target bun-darwin-arm64 --out dist/vdn-server-arm64
          bun desktop/build.ts --target bun-darwin-x64 --out dist/vdn-server-x64
          chmod +x dist/vdn-server-*
          export VDN_DATA="$RUNNER_TEMP/vdn" VDN_NO_OPEN=1
          ./dist/vdn-server-arm64 > run.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4747/api/desktop/status && break; sleep 1; done; echo
          curl -sf localhost:4747/ | grep -q "Configurar Voz de la Novia"
          kill $! || true; cat run.log
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/tauri/src-tauri }
      - name: App de Mac (.dmg)
        run: |
          set -e
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          V=$(tr -d '\r\n ' < desktop/VERSION)
          bun -e "const f='desktop/tauri/src-tauri/tauri.conf.json';const j=JSON.parse(await Bun.file(f).text());j.version='$V';j.bundle.icon=[...j.bundle.icon,'icons/icon.icns'];j.bundle.macOS={signingIdentity:'-',minimumSystemVersion:'11.0'};await Bun.write(f,JSON.stringify(j,null,2));const c='desktop/tauri/src-tauri/Cargo.toml';await Bun.write(c,(await Bun.file(c).text()).replace(/^version = \".*\"/m,'version = \"$V\"'))"
          cd desktop/tauri
          npx --yes @tauri-apps/cli@2 icon src-tauri/icons/icon.png -o src-tauri/icons
          cp ../../dist/vdn-server-arm64 src-tauri/binaries/vdn-server-aarch64-apple-darwin
          cp ../../dist/vdn-server-x64 src-tauri/binaries/vdn-server-x86_64-apple-darwin
          npx --yes @tauri-apps/cli@2 build --target aarch64-apple-darwin --bundles dmg
          npx --yes @tauri-apps/cli@2 build --target x86_64-apple-darwin --bundles dmg
          cd ../..; mkdir -p out
          cp desktop/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg out/VozDeLaNovia-Mac-AppleSilicon.dmg
          cp desktop/tauri/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg out/VozDeLaNovia-Mac-Intel.dmg
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: "out/*.dmg" }

  # Android: app (.apk) que se conecta a la nube o a la PC de la iglesia
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: desktop/movil } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Proyecto Android
        run: |
          set -e
          npm i --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#000000' || echo "sin íconos generados"
          V=$(tr -d '\r\n ' < ../VERSION)
          CODE=$(echo "$V" | awk -F. '{print $1*10000+$2*100+$3}')
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \".*\"/versionName \"$V\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle
      - name: Compilar y firmar el APK
        run: |
          set -e
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease && cd ..
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          U=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$U" aligned.apk
          "$BT/apksigner" sign --ks vdn-android.jks --ks-pass pass:vozdelanovia --key-pass pass:vozdelanovia --ks-key-alias vdn --out VozDeLaNovia-Android.apk aligned.apk
          "$BT/apksigner" verify VozDeLaNovia-Android.apk && ls -la VozDeLaNovia-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "desktop/movil/VozDeLaNovia-Android.apk" }

  publicar:
    needs: [windows, mac, android]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.13" }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - name: Versión
        id: v
        run: echo "v=$(tr -d '\r\n ' < desktop/VERSION)" >> "$GITHUB_OUTPUT"
      - name: Notas de la versión
        run: |
          bun -e "const v=(await Bun.file('desktop/VERSION').text()).trim();const N=JSON.parse(await Bun.file('public/novedades.json').text());const e=N.find(x=>x.v===v)||{items:[]};let t='## Novedades\n'+e.items.map(i=>'- '+i).join('\n')+'\n\n---\n';t+='Voz de la Novia para Windows, Mac y Android. Página de descarga: https://web-production-2c736.up.railway.app/descargar\nWindows: VozDeLaNovia-Setup.exe (o VozDeLaNovia.exe portátil). Mac: VozDeLaNovia-Mac-AppleSilicon.dmg o VozDeLaNovia-Mac-Intel.dmg. Android: VozDeLaNovia-Android.apk.\n';await Bun.write('notas.md',t)"
          cat notas.md
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: escritorio-v${{ steps.v.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/VozDeLaNovia-Setup.exe
            dist/VozDeLaNovia.exe
            dist/VozDeLaNovia-Mac-AppleSilicon.dmg
            dist/VozDeLaNovia-Mac-Intel.dmg
            dist/VozDeLaNovia-Android.apk
          make_latest: true
          name: Voz de la Novia ${{ steps.v.outputs.v }} (Windows, Mac y Android)
          body_path: notas.md
